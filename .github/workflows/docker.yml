name: Docker

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (without the v prefix)'
        required: true
        type: string

jobs:
  version:
    name: Resolve version
    runs-on: ferrlabs-k8s
    permissions:
      contents: read
    outputs:
      value: ${{ steps.resolve.outputs.value }}
    steps:
      - id: resolve
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "${EVENT}" = "workflow_dispatch" ]; then
            echo "value=${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          fi

  lobby:
    name: Lobby image
    needs: version
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: FerrLabs/.github/.github/workflows/reusable-docker-build.yml@b959064c9d271bf841ea67f445e41ee1d2e68d8d # main
    with:
      image-name: ghcr.io/ferrlabs/blastlands/lobby
      tag: ${{ needs.version.outputs.value }}
      context: server
      dockerfile: Dockerfile
      extra-tags: ghcr.io/ferrlabs/blastlands/lobby:sha-${{ github.sha }}
      runner: ferrlabs-k8s
    secrets: inherit
