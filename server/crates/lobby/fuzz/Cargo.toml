[package]
name = "blastlands-lobby-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
blastlands-lobby = { path = ".." }
serde_json = "1"
axum = "0.8"

[workspace]

[[bin]]
name = "display_name"
path = "fuzz_targets/display_name.rs"
test = false
doc = false
bench = false

[[bin]]
name = "client_version"
path = "fuzz_targets/client_version.rs"
test = false
doc = false
bench = false

[[bin]]
name = "release_listing"
path = "fuzz_targets/release_listing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "version_header"
path = "fuzz_targets/version_header.rs"
test = false
doc = false
bench = false
