name: CI Unity

# game-ci runs the ~10 GB unityci/editor container, so in a private repository these
# jobs go to ferrlabs-k8s-docker, the only FerrLabs runners with a Docker daemon.
# The editor does not start until the Unity licence secrets are configured; the
# simulation core is covered without a licence by the CI workflow.

# The path filter that used to live on these triggers is now a step in the gate job
# below. A workflow skipped by a trigger-level `paths:` never reports its checks at
# all, so `Unity tests` simply did not exist on a PR that touched no client file:
# #187, a Renovate bump, has no such check. That is harmless while the check is
# optional and fatal the moment it is required, because a required check that never
# reports leaves the pull request pending for ever. See #175.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: read

jobs:
  # Every step below is conditional rather than the job itself, so this reports a
  # conclusion on every pull request instead of being skipped. A skipped job is
  # accepted by a ruleset in most cases, but "always succeeds" needs no reading of the
  # rules to be sure of, and the runner it wastes when there is nothing to do is a few
  # seconds against the nine minutes the editor takes when there is.
  tests:
    name: Unity tests
    runs-on: ${{ github.event.repository.private && 'ferrlabs-k8s-docker' || 'ubuntu-latest' }}
    steps:
      # Which files changed, asked of the API rather than read from a checkout: the
      # answer is a list of names, and cloning the repository to get it would cost more
      # than the question is worth. A dispatch has nothing to compare against, so it
      # always runs.
      - name: Decide whether the editor has to start
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          set -euo pipefail

          case "$EVENT" in
            pull_request)
              # previous_filename as well as filename: a file renamed out of client/
              # reports only its new path, so the client tree would look untouched by a
              # change that emptied it. The paths: filter this replaces did match that.
              changed=$(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[] | .filename, (.previous_filename // empty)')
              ;;
            push)
              # All zeroes is a branch that did not exist before, which has no range to
              # compare and is treated as "everything changed".
              if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                changed='client/'
              else
                changed=$(gh api "repos/$REPOSITORY/compare/$BEFORE...$AFTER" --jq '.files[] | .filename, (.previous_filename // empty)')
              fi
              ;;
            *)
              changed='client/'
              ;;
          esac

          if [ -z "$UNITY_LICENSE" ]; then
            echo 'RUN=false' >> "$GITHUB_ENV"
            echo '::notice::UNITY_LICENSE is not configured, so the Unity tests are skipped. Set UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD to enable them.'
          # A here-string rather than a pipe into grep. With pipefail set, `grep -q`
          # exiting at its first match kills the still-writing echo with SIGPIPE, the
          # pipeline reports 141, and the branch is skipped: a client change big enough
          # to fill the pipe buffer would have gone green without starting the editor.
          # Reproduced at 4000 paths, every one of them under client/.
          elif grep -qE '^(client/|\.github/workflows/ci-unity\.yml$|\.github/scripts/compile-server\.sh$)' <<<"$changed"; then
            echo 'RUN=true' >> "$GITHUB_ENV"
          else
            echo 'RUN=false' >> "$GITHUB_ENV"
            echo '::notice::No client file changed, so the Unity editor is not started. The check still reports so it can be required.'
          fi

      # The unityci/editor image is around 10 GB and the hosted runner does not have
      # the headroom out of the box: the pull fails with "no space left on device".
      # None of these toolchains are used by the Unity job.
      - if: env.RUN == 'true' && runner.environment == 'github-hosted'
        name: Free disk space for the Unity image
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Not lfs: true. actions/checkout runs its LFS fetch against the endpoint
          # implied by the remote, which is GitHub, while .lfsconfig points at the
          # self-hosted server. It only ever found the objects that predate the move,
          # so main kept passing and every PR adding an asset failed. Fetching in a
          # step of our own is what makes .lfsconfig apply. See #112.
          #
          # This is not a workaround for LFSX: git-lfs honours .lfsconfig everywhere else,
          # including a plain clone on a workstation. It is actions/checkout that does not.
          lfs: false

      - if: env.RUN == 'true'
        name: Fetch LFS objects
        env:
          # The run's own token, no secret to manage. LFSX authenticates the password as
          # a forge token and ignores the username, and since v1.0.0 it accepts a GitHub
          # App installation token, which is what this is: the forge returns the
          # repository to a token that can see it, and that is read access. Read is all a
          # pull needs.
          #
          # Against an LFSX older than that, this is refused with "these credentials do
          # not grant that access to this repository" whatever the job's permissions,
          # because that version required a permissions block the forge does not send for
          # an installation token. Upgrade the server, or fall back to a PAT with read
          # access in a secret. See #112.
          LFS_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$LFS_TOKEN" ]; then
            echo "::error::LFS_TOKEN is empty, so the LFS fetch would fail on a private repository. See issue #112."
            exit 1
          fi
          # Expanded when git calls the helper, so the token never reaches the log or
          # the process table.
          git config --local credential.helper '!f() { echo "username=x-access-token"; echo "password=$LFS_TOKEN"; }; f'
          git lfs pull
          echo "materialised $(git lfs ls-files | wc -l) LFS files"

      - if: env.RUN == 'true' && runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: client/Library
          key: Library-${{ hashFiles('client/Assets/**', 'client/Packages/**', 'client/ProjectSettings/**') }}
          restore-keys: |
            Library-

      - if: env.RUN == 'true' && runner.environment == 'self-hosted'
        id: library
        continue-on-error: true
        uses: ./.github/actions/library-cache
        with:
          mode: restore
          path: client/Library
          name: Library-tests
          key: ${{ hashFiles('client/Assets/**', 'client/Packages/**', 'client/ProjectSettings/**') }}
          s3-key: ${{ secrets.SCCACHE_S3_KEY }}
          s3-secret: ${{ secrets.SCCACHE_S3_SECRET }}

      - if: env.RUN == 'true'
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4
        id: tests
        env:
          HOME: ${{ runner.temp }}/game-ci-home
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: client
          # editmode, not all. Both test assemblies are Editor-only
          # (`includePlatforms: ["Editor"]`), so there is not a single PlayMode test in
          # the project and `all` spends several minutes booting a player to run nothing.
          #
          # It also stopped being free. On 2026-09-01 that empty phase segfaulted the
          # editor, exit 139, and took the whole job red while the 224 EditMode tests it
          # had already passed sat in the artifact. The stack is entirely Unity's own
          # startup, ScriptingCoverage::FilterRecordedMethods under
          # InitializeCoreScriptingClasses, with no project code in it.
          #
          # Put this back to `all` the day a PlayMode test exists, or it will be skipped
          # silently.
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity test results

      - if: env.RUN == 'true' && runner.environment == 'self-hosted'
        continue-on-error: true
        uses: ./.github/actions/library-cache
        with:
          mode: save
          path: client/Library
          name: Library-tests
          key: ${{ steps.library.outputs.key }}
          hit: ${{ steps.library.outputs.hit }}
          s3-key: ${{ secrets.SCCACHE_S3_KEY }}
          s3-secret: ${{ secrets.SCCACHE_S3_SECRET }}

      # ServerLoop.cs and everything else under `#if UNITY_SERVER` is invisible to the
      # run above: the editor compiles for its own platform, where that symbol is never
      # defined. Without this, the only thing that compiles the dedicated server code is
      # the release build, so a compile error there passes every review and every PR
      # check and only appears when a version is being cut. See #240.
      #
      # Same editor image the tests just pulled, so no second 10 GB download, and the
      # project's own Library/ScriptAssemblies for the package references. No licence:
      # this runs the editor's C# compiler, not the editor.
      #
      # UNITY_SERVER is the only define set, because it is the only one any `#if` under
      # _Game reads. A real server build also defines UNITY_STANDALONE_LINUX, UNITY_64
      # and the version family, so the first `#if UNITY_STANDALONE_LINUX` would be
      # checked here in its `#else` branch; add the define then. scriptingDefineSymbols
      # is empty, so there is nothing project-wide to mirror.
      #
      # It cannot replace the editmode run: everything under _Game is compiled into one
      # assembly here and two in Unity, so an `internal` crossing the Core/Runtime line,
      # or Core touching UnityEngine despite noEngineReferences, would pass here. The
      # editmode run catches both.
      - if: env.RUN == 'true'
        name: Compile the dedicated server code
        run: |
          set -euo pipefail
          version="$(sed -n 's/^m_EditorVersion: //p' client/ProjectSettings/ProjectVersion.txt)"
          image="unityci/editor:ubuntu-${version}-linux-il2cpp-3"
          docker image inspect "${image}" >/dev/null 2>&1 \
            || echo "::warning::${image} is not local, so the tag no longer matches the one game-ci pulled and this step is about to download it again"
          docker run --rm --network none \
            -v "${GITHUB_WORKSPACE}:/github/workspace" -w /github/workspace \
            "${image}" \
            bash .github/scripts/compile-server.sh client

      - if: always() && env.RUN == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unity-test-results
          path: ${{ steps.tests.outputs.artifactsPath }}
          retention-days: 7

      - if: env.RUN != 'true'
        name: Say why nothing ran
        run: |
          echo "Unity was not started: no client file changed, or UNITY_LICENSE is not set."
          echo "This job still reports so the check can be a required one. See #175."
