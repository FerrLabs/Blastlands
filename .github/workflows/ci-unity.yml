name: CI Unity

# Unity jobs run on GitHub-hosted runners: game-ci needs to pull and run the
# ~10 GB unityci/editor container, which the ARC k8s runners cannot do.
# They are skipped entirely until the Unity licence secrets are configured —
# the simulation core is covered without a licence by the CI workflow.

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/ci-unity.yml'
  pull_request:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/ci-unity.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  licence:
    name: Licence
    runs-on: ferrlabs-k8s
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "${UNITY_LICENSE}" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::notice::UNITY_LICENSE is not configured, so the Unity tests are skipped. Set UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD to enable them.'
          fi

  tests:
    name: Unity tests
    needs: licence
    if: needs.licence.outputs.available == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: client/Library
          key: Library-${{ hashFiles('client/Assets/**', 'client/Packages/**', 'client/ProjectSettings/**') }}
          restore-keys: |
            Library-

      - uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9 # v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: client
          testMode: all
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity test results

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: unity-test-results
          path: ${{ steps.tests.outputs.artifactsPath }}
