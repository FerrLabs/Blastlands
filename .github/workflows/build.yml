name: Build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  licence:
    name: Licence
    runs-on: ferrlabs-k8s
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "${UNITY_LICENSE}" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::notice::UNITY_LICENSE is not configured, so no player or server build is produced.'
          fi

  build:
    name: ${{ matrix.name }}
    needs: licence
    if: needs.licence.outputs.available == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows client
            targetPlatform: StandaloneWindows64
            customParameters: ''
          - name: Linux client
            targetPlatform: StandaloneLinux64
            customParameters: ''
          - name: Linux dedicated server
            targetPlatform: StandaloneLinux64
            customParameters: -standaloneBuildSubtarget Server
    steps:
      # The unityci/editor image is around 10 GB and the hosted runner does not have
      # the headroom out of the box: the pull fails with "no space left on device".
      - name: Free disk space for the Unity image
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Not lfs: true. actions/checkout runs its LFS fetch against the endpoint
          # implied by the remote, which is GitHub, while .lfsconfig points at the
          # self-hosted server. It only ever found the objects that predate the move,
          # so main kept passing and every PR adding an asset failed. Fetching in a
          # step of our own is what makes .lfsconfig apply. See #112.
          #
          # This is not a workaround for LFSX: git-lfs honours .lfsconfig everywhere else,
          # including a plain clone on a workstation. It is actions/checkout that does not.
          lfs: false

      - name: Fetch LFS objects
        env:
          # The run's own token, no secret to manage. LFSX authenticates the password as
          # a forge token and ignores the username, and since v1.0.0 it accepts a GitHub
          # App installation token, which is what this is: the forge returns the
          # repository to a token that can see it, and that is read access. Read is all a
          # pull needs.
          #
          # Against an LFSX older than that, this is refused with "these credentials do
          # not grant that access to this repository" whatever the job's permissions,
          # because that version required a permissions block the forge does not send for
          # an installation token. Upgrade the server, or fall back to a PAT with read
          # access in a secret. See #112.
          LFS_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$LFS_TOKEN" ]; then
            echo "::error::LFS_TOKEN is empty, so the LFS fetch would fail on a private repository. See issue #112."
            exit 1
          fi
          # Expanded when git calls the helper, so the token never reaches the log or
          # the process table.
          git config --local credential.helper '!f() { echo "username=x-access-token"; echo "password=$LFS_TOKEN"; }; f'
          git lfs pull
          echo "materialised $(git lfs ls-files | wc -l) LFS files"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: client/Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('client/Assets/**', 'client/Packages/**', 'client/ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      - uses: game-ci/unity-builder@d829bfc901f2347c8fe18898f06712b66916ef42 # v5
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: client
          targetPlatform: ${{ matrix.targetPlatform }}
          customParameters: ${{ matrix.customParameters }}
          buildName: Blastlands

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.name }}
          path: build

  # Attache le client Windows à la release et publie ce qu'il faut pour le
  # servir.
  #
  # Sans ce job, le client ne vivait que dans un artefact de workflow : il
  # expire, son URL est éphémère et demande une authentification. Les trois
  # valeurs que le lobby exige — version, URL, empreinte — n'avaient donc aucune
  # source, et la seule façon de les fournir était de les saisir à la main à
  # chaque version.
  #
  # C'est précisément ce qu'il ne faut pas faire d'une empreinte : le jour où
  # elle cesse de décrire le binaire publié, TOUS les clients se voient refuser
  # la mise à jour, sans que rien n'explique pourquoi. La calculer ici, sur le
  # fichier qu'on vient d'attacher, rend cette dérive impossible.
  publish-client:
    name: Publish client
    needs: build
    # Uniquement sur une vraie release : un `workflow_dispatch` construit pour
    # vérifier, il ne publie pas.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      # `write` ici et non en tête du fichier : au niveau du workflow, la
      # permission irait aussi à `build`, qui tire une image Unity de 10 Go et
      # exécute un builder tiers sur le contenu du dépôt. Seul ce job attache
      # quelque chose à la release. Le job `image` plus bas pose déjà son propre
      # bloc, c'est l'idiome de ce fichier.
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v5
        with:
          name: Windows client
          path: client-build

      - name: Package, hash and attach
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # Depuis le dossier de PLATEFORME, pas depuis la racine de
          # l'artefact : `unity-builder` écrit dans `build/<targetPlatform>/`,
          # et `upload-artifact` publie `build`, donc le téléchargement porte un
          # niveau `StandaloneWindows64/`. Le job `image` plus bas l'exploite de
          # la même façon (`chmod +x image/StandaloneLinux64/Blastlands`).
          #
          # Sans ce niveau supplémentaire, l'archive contiendrait un dossier au
          # lieu du jeu, et le `sha256` figerait cette disposition dans la
          # release.
          ARCHIVE="Blastlands-${TAG}-windows.zip"
          (cd client-build/StandaloneWindows64 && zip -qr "../../${ARCHIVE}" .)

          # L'empreinte est calculée sur le fichier EXACT qui part chez GitHub,
          # après compression, et non sur les sources ou le dossier.
          SHA=$(sha256sum "${ARCHIVE}" | cut -d' ' -f1)
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"

          gh release upload "${TAG}" "${ARCHIVE}" --clobber --repo "${GITHUB_REPOSITORY}"
        id: package

      # Les trois valeurs que le lobby lit, écrites là où il les lira. Les
      # produire ici plutôt que de les saisir garantit qu'elles décrivent
      # l'artefact que ce même job vient de publier.
      - name: Publish the client manifest to FerrVault
        env:
          FERRVAULT_TOKEN: ${{ secrets.FERRVAULT_BLASTLANDS_TOKEN }}
          FERRVAULT_URL: ${{ vars.FERRVAULT_URL }}
          TAG: ${{ github.event.release.tag_name }}
          SHA: ${{ steps.package.outputs.sha256 }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail
          # Le lobby attend une version en trois parties, sans le `v` du tag.
          VERSION="${TAG#v}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ARCHIVE}"

          # Le chemin porte l'environnement : `default` est celui que la
          # création d'un vault pose, et le seul que ce produit utilise.
          BASE="${FERRVAULT_URL}/vaults/blastlands/environments/default/secrets"

          # `PUT` d'abord, `POST` en repli : le premier met à jour un secret
          # existant et échoue s'il n'existe pas, le second le crée. Tenter la
          # mise à jour en premier évite qu'une création concurrente fasse
          # échouer la publication.
          put() {
            local auth="Authorization: Bearer ${FERRVAULT_TOKEN}"
            if curl -sS -f -X PUT "${BASE}/$1" \
                 -H "$auth" -H 'Content-Type: application/json' \
                 --data "$(jq -n --arg v "$2" '{value: $v}')" > /dev/null 2>&1; then
              return 0
            fi
            curl -sS -f -X POST "${BASE}" \
              -H "$auth" -H 'Content-Type: application/json' \
              --data "$(jq -n --arg n "$1" --arg v "$2" '{name: $n, value: $v}')" > /dev/null
          }

          # L'ORDRE compte, et `LATEST` vient en dernier.
          #
          # Avec `set -e`, un échec sur l'une des écritures laisse les
          # précédentes en place. Publier `LATEST` d'abord puis échouer sur
          # l'empreinte laisserait le vault annoncer la nouvelle version, avec
          # sa nouvelle URL, et l'ANCIENNE empreinte : la dérive exacte que ce
          # job existe pour rendre impossible.
          #
          # En dernier, `LATEST` devient le déclencheur : un échec partiel
          # laisse le manifeste sur la version précédente, cohérent avec
          # lui-même.
          put BLASTLANDS_CLIENT_SHA256  "${SHA}"
          put BLASTLANDS_CLIENT_URL     "${URL}"
          put BLASTLANDS_CLIENT_LATEST  "${VERSION}"

          # `BLASTLANDS_CLIENT_MINIMUM` n'est PAS touché : relever le plancher
          # de compatibilité coupe les joueurs qui n'ont pas encore mis à jour,
          # ce qui est une décision, pas une conséquence d'un build.
          echo "Manifeste publié : ${VERSION}"

  # Wrapped around the server this workflow already built, rather than built again in a
  # workflow of its own. A second job pulling the same 10 GB editor to run the same build
  # would ship an image whose binary is not the one published beside it, and the two
  # would drift the first time one of them changed a pin.
  #
  # Deliberately not the reusable-docker-build workflow the lobby uses: that one checks
  # out the repository and builds from it, and what goes in this image is an artifact
  # rather than anything in the tree. A reusable workflow is a job, so there is nothing
  # to hand it.
  image:
    name: Server image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false

      # The build job uploads `path: build`, so StandaloneLinux64/ is already at the root
      # of the artifact and lands where the Dockerfile expects it.
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v5
        with:
          name: Linux dedicated server
          path: image

      # A context of its own rather than client/, which is the whole Unity project.
      # Assets and Library are gigabytes and there is no .dockerignore, so building from
      # there would hand all of it to the daemon to copy one directory out of it.
      - name: Assemble the build context
        run: |
          set -euo pipefail
          cp client/Dockerfile image/Dockerfile

          # The executable bit does not survive an artifact: upload-artifact does not
          # carry it, so without this the entrypoint is a permission denied that only
          # appears when somebody runs the image.
          chmod +x image/StandaloneLinux64/Blastlands
          ls -la image/StandaloneLinux64 | head

      - name: Resolve the tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "${EVENT}" = "release" ]; then
            echo "value=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: image
          file: image/Dockerfile
          push: true
          tags: |
            ghcr.io/ferrlabs/blastlands/server:${{ steps.tag.outputs.value }}
            ghcr.io/ferrlabs/blastlands/server:sha-${{ github.sha }}
