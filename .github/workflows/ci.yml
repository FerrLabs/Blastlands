name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  core:
    permissions:
      contents: read
    name: Simulation core
    runs-on: ferrlabs-k8s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The ARC runners run as non-root, so setup-dotnet cannot write its default
      # /usr/share/dotnet. Install into the runner temp dir instead.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: '9.0.x'

      - name: Test
        run: dotnet test tests/Blastlands.Core.Tests --configuration Release

  lobby:
    name: Lobby
    # Pinned behind main: ea1f412 carries FerrLabs/.github#217, which grants the nested
    # sonarqube job pull-requests: write while the reusable workflow still caps itself at
    # contents: read. A called workflow cannot ask for more than its caller allows, so
    # every caller startup-fails before a step runs. Unpin once .github is fixed.
    #
    # Renovate walked the pin forward to 67e9379 in #38 and put main straight back in
    # the hole, because a digest bump reads as routine and the reason not to take it
    # lives in this comment rather than anywhere a bot can see. The rule in
    # renovate.json is what stops it happening again: drop that rule and this pin
    # together, never one without the other.
    uses: FerrLabs/.github/.github/workflows/reusable-ci-rust.yml@d3ce80b43af8b567b503ab4c3ee44d6e33c246f5 # main
    with:
      working-directory: server
      rust-toolchain: '1.88'
      cargo-flags: --all-targets --all-features
      clippy-args: -D warnings
      enable-coverage: false
      enable-typos: false
      enable-deny: false
    secrets: inherit
