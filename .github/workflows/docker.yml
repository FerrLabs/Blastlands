name: Docker

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (without the v prefix)'
        required: true
        type: string

jobs:
  version:
    name: Resolve version
    runs-on: ${{ github.event.repository.private && 'ferrlabs-k8s' || 'ubuntu-latest' }}
    permissions:
      contents: read
    outputs:
      value: ${{ steps.resolve.outputs.value }}
    steps:
      - id: resolve
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "${EVENT}" = "workflow_dispatch" ]; then
            echo "value=${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          fi

  lobby:
    name: Lobby image
    needs: version
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: FerrLabs/.github/.github/workflows/reusable-docker-build.yml@c4833f85755afde4c7f702858270fe5deb0dba9e # main
    with:
      image-name: ghcr.io/ferrlabs/blastlands/lobby
      tag: ${{ needs.version.outputs.value }}
      context: server
      dockerfile: Dockerfile
      extra-tags: ghcr.io/ferrlabs/blastlands/lobby:sha-${{ github.sha }}
      trivyignores: server/.trivyignore
      # No `runner:`. Pinning `ferrlabs-k8s` was right while this repository was
      # private; on a public one the job stays queued for ever, because the ARC scale
      # sets do not serve public repositories. Left empty, the reusable workflow takes
      # the FerrLabs pool on a private FerrLabs repository and `ubuntu-latest` anywhere
      # else, which is what `github.event.repository.private` already decides in every
      # other job here.
      #
      # No `secrets:` either. server/Dockerfile mounts none: it is a plain cargo build
      # off crates.io, so every secret the reusable build accepts is optional here, and
      # inheriting handed a public repository's workflow the whole org set for nothing.
      # GITHUB_TOKEN reaches a called workflow on its own.
